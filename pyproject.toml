[tool.poetry]
name = 'bb'
description = 'Build and run executable targets from cmake build dirs'
readme = 'README.md'
authors = ["ben.leadbetter"]
packages = [{ include = "bb" }]
version = '0.1.0'

[tool.poetry.scripts]
bb = 'bb.main:main'

[tool.poetry.dependencies]
python = '>=3.11,<3.14'

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
